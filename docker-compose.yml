services:
  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    image: smart-city-kafka:4.3.1
    container_name: kafka-smartcity
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - data-net

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init-smartcity
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        echo "Waiting for Kafka..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null
        echo "Creating Smart City topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.environment.readings --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.water.readings --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.traffic.readings --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.spark.environment --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.spark.water --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.spark.traffic --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.spark.errors --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcity.spark.alerts --partitions 1 --replication-factor 1
        echo "Topics created successfully:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    networks:
      - data-net

  mongodb:
    image: mongo:8.0.29-noble
    container_name: mongodb-smartcity
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - data-net

  node-red:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    image: smart-city-node-red:5.0.4
    container_name: nodered-smartcity
    hostname: node-red
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "1880:1880"
    environment:
      KAFKA_BROKERS: kafka:29092
      TZ: Africa/Casablanca
    volumes:
      - ./node-red:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', "node -e \"require('http').get('http://localhost:1880', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-city-backend:2.0.0
    container_name: backend-smartcity
    hostname: backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/smartcity
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', "node -e \"require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - data-net
      - backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
    image: smart-city-frontend:2.0.0
    container_name: frontend-smartcity
    hostname: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: smart-city-spark:4.2.0
    container_name: spark-smartcity
    hostname: spark
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_LAKE_BASE_DIR: /app/data_lake
      SPARK_CHECKPOINT_BASE_DIR: /app/checkpoints
      SPARK_CHECKPOINT_VERSION: v4
    volumes:
      - ./data_lake:/app/data_lake
      - ./spark/checkpoints:/app/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'org.apache.spark.deploy.SparkSubmit' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - data-net

volumes:
  kafka_data:
  mongodb_data:

networks:
  data-net:
    driver: bridge
  backend-net:
    driver: bridge
